<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/bilibili-ficon.ico" type="image/x-icon" />
    <title>Bilibili Banner</title>
  </head>
  <body>
    <main id="banner-container">
      <div class="loading-banner">
        <div class="loading-spinner"></div>
        <p>加载中</p>
      </div>
      <div class="failed-banner">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="48"
          height="48"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          role="img"
        >
          <title>Loading failed</title>
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <p class="load-failed-title">加载失败</p>
      </div>
      <div id="logo"></div>
    </main>

    <div id="control-panel">
      <div id="tag-filter"></div>
      <div id="year-selector"></div>
      <div id="timeline-selector"></div>
    </div>
    <div id="spacer"></div>
    <footer id="footer">
      <div class="footer-left">
        <button id="help-btn" type="button" class="help-btn" title="查看操作说明">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="help-icon-svg">
            <title>帮助说明</title>
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
        </button>
      </div>
      <div class="footer-center">
        <span class="copyright">
          Released under the MIT License<br />
          Copyright © <span id="current-year">2026</span>
          <script>
            document.getElementById("current-year").textContent =
              new Date().getFullYear();
          </script>
          <a
            href="https://github.com/b23-org"
            target="_blank"
            rel="noopener noreferrer"
            >b23-org</a
          >
        </span>
      </div>
      <div class="footer-right">
        <a
          href="https://github.com/b23-org/bilibili-banner"
          target="_blank"
          rel="noopener noreferrer"
          class="github-link"
          title="Source Code"
        >
          <svg
            aria-hidden="true"
            focusable="false"
            class="octicon octicon-mark-github"
            viewBox="0 0 24 24"
            fill="currentColor"
            display="inline-block"
            overflow="visible"
            style="vertical-align: text-bottom"
          >
            <path
              d="M12 1C5.923 1 1 5.923 1 12c0 4.867 3.149 8.979 7.521 10.436.55.096.756-.233.756-.522 0-.262-.013-1.128-.013-2.049-2.764.509-3.479-.674-3.699-1.292-.124-.317-.66-1.293-1.127-1.554-.385-.207-.936-.715-.014-.729.866-.014 1.485.797 1.691 1.128.99 1.663 2.571 1.196 3.204.907.096-.715.385-1.196.701-1.471-2.448-.275-5.005-1.224-5.005-5.432 0-1.196.426-2.186 1.128-2.956-.111-.275-.496-1.402.11-2.915 0 0 .921-.288 3.024 1.128a10.193 10.193 0 0 1 2.75-.371c.936 0 1.871.123 2.75.371 2.104-1.43 3.025-1.128 3.025-1.128.605 1.513.221 2.64.111 2.915.701.77 1.127 1.747 1.127 2.956 0 4.222-2.571 5.157-5.019 5.432.399.344.743 1.004.743 2.035 0 1.471-.014 2.654-.014 3.025 0 .289.206.632.756.522C19.851 20.979 23 16.854 23 12c0-6.077-4.922-11-11-11Z"
            ></path>
          </svg>
        </a>
        <a
          href="https://www.bilibili.com"
          target="_blank"
          rel="noopener noreferrer"
          class="bilibili-link"
          title="Bilibili"
        >
          <svg
            viewBox="0 0 24 24"
            fill="currentColor"
            fill-rule="evenodd"
            class="bilibili-icon-svg"
            xmlns="http://www.w3.org/2000/svg"
          >
            <title>Bilibili</title>
            <path clip-rule="evenodd" d="M4.977 3.561a1.31 1.31 0 111.818-1.884l2.828 2.728c.08.078.149.163.205.254h4.277a1.32 1.32 0 01.205-.254l2.828-2.728a1.31 1.31 0 011.818 1.884L17.82 4.66h.848A5.333 5.333 0 0124 9.992v7.34a5.333 5.333 0 01-5.333 5.334H5.333A5.333 5.333 0 010 17.333V9.992a5.333 5.333 0 015.333-5.333h.781L4.977 3.56zm.356 3.67a2.667 2.667 0 00-2.666 2.667v7.529a2.667 2.667 0 002.666 2.666h13.334a2.667 2.667 0 002.666-2.666v-7.53a2.667 2.667 0 00-2.666-2.666H5.333zm1.334 5.192a1.333 1.333 0 112.666 0v1.192a1.333 1.333 0 11-2.666 0v-1.192zM16 11.09c-.736 0-1.333.597-1.333 1.333v1.192a1.333 1.333 0 102.666 0v-1.192c0-.736-.597-1.333-1.333-1.333z"></path>
          </svg>
        </a>
      </div>
    </footer>


    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
