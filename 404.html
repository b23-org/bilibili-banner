<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>出错啦! - Bilibili Banner</title>
    <link rel="shortcut icon" href="/bilibili-ficon.ico" type="image/x-icon" />
    <style>
      :root {
        --bg: #ffffff;
        --text_white: #ffffff;
        --brand_blue: #00aeec;
        --brand_blue_dark: #00a1d6;
        --graph_bg_regular: #f1f2f3;
        --text: #9499a0;
      }

      html {
        background: #ffffff;
      }

      body {
        vertical-align: middle;
        padding: 0;
        margin: 30px auto 30px;
        width: 980px;
        background: var(--bg);
        border-radius: 10px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }

      .widescreen body {
        width: 1160px;
      }

      .error-panel {
        overflow: hidden;
      }

      .error-panel .rollback-btn {
        display: inline-block;
        line-height: 40px;
        vertical-align: middle;
        text-align: center;
        background: var(--brand_blue_dark);
        color: var(--text_white);
        border-radius: 4px;
        font-size: 16px;
        transition: 0.2s;
        cursor: pointer;
        text-decoration: none;
      }

      .error-panel .rollback-btn:hover {
        background: var(--brand_blue);
      }

      .error-split {
        width: 100%;
        height: 40px;
      }

      .error-manga {
        padding: 30px;
        text-align: center;
      }

      .error-manga img {
        background-color: var(--text_white);
        max-width: 800px;
      }

      .error-manga .change-img-btn {
        display: block;
        height: 48px;
        width: 150px;
        margin: 30px auto 0;
        line-height: 48px;
        text-align: center;
        font-size: 16px;
        background: var(--brand_blue_dark);
        color: var(--text_white);
        border-radius: 4px;
        transition: 0.2s;
        cursor: pointer;
        border: none;
        text-decoration: none;
      }

      .error-manga .change-img-btn:not(.off):hover {
        background: var(--brand_blue);
      }

      .error-manga .change-img-btn.off {
        background-color: var(--graph_bg_regular);
        color: var(--text);
        cursor: not-allowed;
      }

      .h5-container {
        display: none;
      }

      @media screen and (max-width: 500px) {
        body {
          width: 100%;
          margin: 0;
          background: #ffffff;
          border-radius: 0;
        }

        .error-panel,
        .error-split,
        .error-manga {
          display: none;
        }

        .h5-container {
          display: block;
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
        }

        .h5__img {
          display: block;
          width: 300px;
        }

        .h5__desc {
          color: #a0a0a0;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="error-panel">
      <img
        src="/assets/error/very_sorry.png"
        alt="Sorry, page not found"
      />
      <div style="text-align: center; padding: 0 0 40px 0">
        <a href="/" class="rollback-btn" style="padding: 0 20px; float: none"
          >返回首页</a
        >
      </div>
    </div>

    <div class="error-split" id="up"></div>

    <div class="error-manga">
      <img id="manga-img" src="" alt="404 Manga" style="display: none" />
      <button type="button" id="change-btn" class="change-img-btn">换一张</button>
    </div>

    <div class="h5-container">
      <img
        class="h5__img"
        src="/assets/error/error_01.png"
        alt="parse failed"
      />
      <div class="h5__desc">
        <span>Σ(oﾟдﾟoﾉ) 无法找到该页面~</span>
      </div>
    </div>

    <script type="module" src="/src/404.ts"></script>
  </body>
</html>
