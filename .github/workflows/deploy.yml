name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "src/**"
      - "index.html"

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  deploy:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install

      - name: Data validation
        run: |
          pnpm data generate
          pnpm data validate
          pnpm data check

      - name: Build
        run: pnpm build

      # 由于 pnpm 新版本(>=10)默认不信任任何脚本
      # 需要手动批准 cloudflare/wrangler-action 的 sharp 和 workerd 安装脚本
      - name: Approve build scripts for Wrangler
        run: |
          echo "  sharp: true" >> pnpm-workspace.yaml
          echo "  workerd: true" >> pnpm-workspace.yaml

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        id: wrangler_deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=${{ github.ref_name }}
