name: Lint Check

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "src/**"
      - "scripts/**"
      - "index.html"
      - "package.json"

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install

      - name: Run Biome Lint Check
        run: pnpm exec biome check src/ scripts/ index.html public/

      - name: Run Type Check
        run: pnpm typecheck
